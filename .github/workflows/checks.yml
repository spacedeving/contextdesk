name: ContextDesk checks
on: [push, pull_request]
jobs:
  workspace:
    # Keep the runner OS compatible with the pinned Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx --no-install tsc --noEmit --incremental false
      - run: npm run build
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: node tests/workspace-smoke.mjs --browser
